[target]
executable = "helldivers2.exe"
foreground_poll_ms = 5
foreground_cache_max_age_ms = 50

[controls]
fire_toggle_button = "MB1"
normal_fire_modifier = "CTRL"
primary_select_key = "1"
secondary_select_key = "2"
reload_key = "R"
poll_ms = 5
toggle_debounce_ms = 30
deferred_bypass_click_ms = 20

[weapons]
reload_on_select = true
switch_settle_ms = 500

[behavior]
start_policy = "immediate"

[diagnostics]
ctrl_bypass_logging = false
state_tracing = false

[audio.on]
frequency_hz = 1000
duration_ms = 100

[audio.off]
frequency_hz = 500
duration_ms = 150

[primary]
shots_per_cycle = 3
fire_hold_ms = 900
inter_shot_ms = 20
post_last_shot_ms = 300
reload_press_ms = 25
reload_wait_ms = 2600

[secondary]
shots_per_cycle = 13
shot_period_ms = 180
fire_press_ms = 35
reload_press_ms = 25
reload_wait_ms = 2000
