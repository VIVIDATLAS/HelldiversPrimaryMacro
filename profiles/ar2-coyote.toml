[target]
executable = "helldivers2.exe"
foreground_poll_ms = 5
foreground_cache_max_age_ms = 50

[controls]
fire_toggle_button = "MB1"
normal_fire_modifier = "CTRL"
primary_select_key = "1"
secondary_select_key = "2"
reload_key = "R"
poll_ms = 5
toggle_debounce_ms = 30
deferred_bypass_click_ms = 20
shift_cancels_aim_natively = false

[output]
fire_device = "mouse"

[weapons]
reload_on_select = true
switch_settle_ms = 500

[behavior]
start_policy = "immediate"

[diagnostics]
ctrl_bypass_logging = false
state_tracing = false

[stratagems]
enabled = true
four_target_trigger = "f23"
support_trigger = "f24"
key_press_ms = 20
key_gap_ms = 20
ctrl_settle_ms = 20
action_press_ms = 20
action_delay_ms = 800

[audio.on]
frequency_hz = 1000
duration_ms = 100

[audio.off]
frequency_hz = 500
duration_ms = 150

[primary]
fire_mode = "automatic_hold"
automatic_hold_ms = 4450
post_fire_reload_delay_ms = 0
reload_press_ms = 25
reload_wait_ms = 2000

[secondary]
fire_mode = "tap"
shots_per_cycle = 13
shot_period_ms = 120
fire_press_ms = 35
reload_press_ms = 25
reload_wait_ms = 2000
